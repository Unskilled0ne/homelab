---
- name: Setup and Maintain Arch Linux SecOps Node
  hosts: pc
  become: true
  tasks:
    - name: Ensure base and security packages are installed
      community.general.pacman:
        name:
          - docker
          - docker-compose
          - docker-buildx
          - ufw
          - nmap
          - tcpdump
          - wireshark-qt
          - socat
          - openbsd-netcat
          - bind
          - whois
          - traceroute
          - mtr
        state: present

    - name: Ensure docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Ensure UFW is active and configured
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
